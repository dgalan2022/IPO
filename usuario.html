<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Perfil de Usuario - IAversiesverdad</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#3b82f6",
          danger: "#ef4444",
          background: "#f4f4f5",
          "background-dark": "#18181b",
        },
        fontFamily: { display: ["Poppins", "sans-serif"] },
      },
    },
  };
</script>
<style>
.material-icons { font-size: 24px; line-height: 1; }
.animate-popup {
  animation: popupAnim 1.5s ease forwards;
}
@keyframes popupAnim {
  0% {opacity:0; transform: translateY(-20px);}
  10% {opacity:1; transform: translateY(0);}
  90% {opacity:1; transform: translateY(0);}
  100% {opacity:0; transform: translateY(-20px);}
}
</style>
</head>
<body class="font-display bg-background dark:bg-background-dark text-zinc-900 dark:text-zinc-100">

<div class="flex flex-col min-h-screen max-w-4xl mx-auto p-6">

  <!-- Header -->
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-zinc-800 dark:text-zinc-200">Perfil de Usuario</h1>
    <button onclick="history.back()" class="flex items-center gap-1 text-primary font-semibold hover:underline">
      <span class="material-icons text-sm">arrow_back</span> Volver
    </button>
  </header>

  <!-- Perfil -->
  <div class="bg-white dark:bg-zinc-900 p-6 rounded-lg shadow space-y-6">

    <!-- Imagen y nombre -->
    <div class="flex gap-6 items-center">
      <div class="relative">
        <img id="userPhoto" src="default-avatar.png" alt="Usuario" class="w-24 h-24 rounded-full object-cover border-2 border-primary"/>
        <button id="changePhotoBtn" class="absolute bottom-0 right-0 bg-primary text-white rounded-full p-1 hover:bg-blue-600">
          <span class="material-icons text-sm">edit</span>
        </button>
        <input type="file" id="photoInput" accept="image/*" class="hidden"/>
      </div>
      <div>
        <h2 id="userName" class="text-xl font-semibold text-zinc-800 dark:text-zinc-200">Nombre Usuario</h2>
        <div class="flex gap-2 mt-1">
          <button class="change-btn bg-primary text-white px-3 py-1 rounded hover:bg-blue-600" data-type="username">Cambiar usuario</button>
          <button class="revert-btn bg-zinc-300 dark:bg-zinc-700 text-zinc-800 dark:text-zinc-200 px-3 py-1 rounded hover:bg-zinc-400 dark:hover:bg-zinc-600 hidden" data-type="username">Revertir</button>
        </div>
      </div>
      <div class="ml-auto">
        <span id="userRole" class="px-3 py-1 rounded-full bg-blue-100 text-blue-600 font-semibold">Estándar</span>
      </div>
    </div>

    <!-- Información -->
    <div class="grid grid-cols-2 gap-6">
      <div>
        <p class="text-zinc-600 dark:text-zinc-400">Correo:</p>
        <div class="flex gap-2 items-center">
          <span id="userEmail">usuario@correo.com</span>
          <button class="change-btn bg-primary text-white px-2 py-1 rounded hover:bg-blue-600" data-type="email">Cambiar</button>
          <button class="revert-btn bg-zinc-300 dark:bg-zinc-700 text-zinc-800 dark:text-zinc-200 px-2 py-1 rounded hover:bg-zinc-400 dark:hover:bg-zinc-600 hidden" data-type="email">Revertir</button>
        </div>
      </div>
      <div>
        <p class="text-zinc-600 dark:text-zinc-400">Contraseña:</p>
        <div class="flex gap-2 items-center">
          <span>********</span>
          <button class="change-btn bg-primary text-white px-2 py-1 rounded hover:bg-blue-600" data-type="password">Cambiar</button>
          <button class="revert-btn bg-zinc-300 dark:bg-zinc-700 text-zinc-800 dark:text-zinc-200 px-2 py-1 rounded hover:bg-zinc-400 dark:hover:bg-zinc-600 hidden" data-type="password">Revertir</button>
        </div>
      </div>
      <div>
        <p class="text-zinc-600 dark:text-zinc-400">Fecha de creación:</p>
        <span>19/11/2025</span>
      </div>
      <div>
        <p class="text-zinc-600 dark:text-zinc-400">Rol:</p>
        <div class="flex gap-2 items-center">
          <span id="userRole2">Estándar</span>
          <button class="change-btn bg-primary text-white px-2 py-1 rounded hover:bg-blue-600" data-type="role">Cambiar</button>
          <button class="revert-btn bg-zinc-300 dark:bg-zinc-700 text-zinc-800 dark:text-zinc-200 px-2 py-1 rounded hover:bg-zinc-400 dark:hover:bg-zinc-600 hidden" data-type="role">Revertir</button>
        </div>
      </div>
    </div>

    <!-- Acciones -->
    <div class="flex gap-4 mt-4">
      <button id="logoutBtn" class="bg-zinc-300 dark:bg-zinc-700 text-zinc-800 dark:text-zinc-200 px-4 py-2 rounded hover:bg-zinc-400 dark:hover:bg-zinc-600">Cerrar sesión</button>
      <button id="deleteAccountBtn" class="bg-danger text-white px-4 py-2 rounded hover:bg-red-600">Eliminar cuenta</button>
    </div>

    <!-- Guardar cambios -->
    <div class="mt-4">
      <button id="saveChangesBtn" class="bg-primary text-white px-4 py-2 rounded hover:bg-blue-600">Guardar cambios</button>
    </div>

  </div>
</div>

<!-- Modal eliminar cuenta -->
<div id="modalDelete" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
  <div class="bg-white dark:bg-zinc-900 p-6 rounded-lg w-96">
    <h2 class="text-lg font-semibold mb-4 text-zinc-800 dark:text-zinc-200 text-center">Confirmar eliminación</h2>
    <p class="mb-4 text-zinc-700 dark:text-zinc-300 text-center">¿Seguro que quieres eliminar tu cuenta?</p>
    <div class="flex justify-center gap-4">
      <button id="cancelDelete" class="px-4 py-2 bg-zinc-300 dark:bg-zinc-700 rounded hover:bg-zinc-400 dark:hover:bg-zinc-600">Cancelar</button>
      <button id="confirmDelete" class="px-4 py-2 bg-danger text-white rounded hover:bg-red-600">Eliminar</button>
    </div>
  </div>
</div>

<!-- Modal cambios (azul) -->
<div id="modalChange" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
  <div class="bg-white dark:bg-zinc-900 p-6 rounded-lg w-96">
    <h2 id="modalTitle" class="text-lg font-semibold mb-4 text-zinc-800 dark:text-zinc-200 text-center">Confirmar cambio</h2>
    <p id="modalText" class="mb-4 text-zinc-700 dark:text-zinc-300 text-center">¿Seguro que quieres hacer este cambio?</p>
    <div id="modalContent" class="mb-4"></div>
    <div class="flex justify-center gap-4">
      <button id="cancelChange" class="px-4 py-2 bg-zinc-300 dark:bg-zinc-700 rounded hover:bg-zinc-400 dark:hover:bg-zinc-600">Cancelar</button>
      <button id="confirmChange" class="px-4 py-2 bg-primary text-white rounded hover:bg-blue-600">Aceptar</button>
    </div>
  </div>
</div>

<!-- Animación de guardado -->
<div id="savePopup" class="fixed top-5 right-5 bg-green-100 dark:bg-green-800 text-green-800 dark:text-green-100 px-4 py-2 rounded-lg opacity-0 pointer-events-none text-center">Cambios guardados correctamente</div>

<script>
let userData = {
  photo: "default-avatar.png",
  username: "Nombre Usuario",
  email: "usuario@correo.com",
  password: "1234", // contraseña real
  role: "Estándar"
};
let backupValue = "";

// Cambio de foto
const changePhotoBtn = document.getElementById('changePhotoBtn');
const photoInput = document.getElementById('photoInput');
const userPhoto = document.getElementById('userPhoto');
changePhotoBtn.addEventListener('click', ()=> photoInput.click());
photoInput.addEventListener('change', ()=>{
  if(photoInput.files && photoInput.files[0]){
    const url = URL.createObjectURL(photoInput.files[0]);
    userPhoto.src = url;
    userData.photo = url;
  }
});

// Botones de cambio y revertir
const changeBtns = document.querySelectorAll('.change-btn');
const revertBtns = document.querySelectorAll('.revert-btn');
let currentChangeType = null;

changeBtns.forEach(btn=>{
  btn.addEventListener('click', (e)=>{
    const type = e.currentTarget.dataset.type;
    currentChangeType = type;
    backupValue = userData[type];
    const modal = document.getElementById('modalChange');
    modal.classList.remove('hidden');
    document.getElementById('modalTitle').textContent = `Cambiar ${type}`;
    document.getElementById('modalText').textContent = `Ingresa nueva información y tu contraseña`;
    const modalContent = document.getElementById('modalContent');
    modalContent.innerHTML = "";

    if(type==="password"){
      modalContent.innerHTML += `<input type="password" id="newPassword" placeholder="Nueva contraseña" class="w-full px-3 py-2 rounded border border-zinc-300 dark:border-zinc-700 mb-2"/>
      <input type="password" id="confirmNewPassword" placeholder="Confirmar nueva contraseña" class="w-full px-3 py-2 rounded border border-zinc-300 dark:border-zinc-700 mb-2"/>`;
    } else if(type==="role"){
      modalContent.innerHTML += `<select id="newRole" class="w-full px-3 py-2 rounded border border-zinc-300 dark:border-zinc-700 mb-2">
        <option value="Estándar">Estándar</option>
        <option value="Periodista">Periodista</option>
      </select>`;
    } else {
      modalContent.innerHTML += `<input type="text" id="modalInput" class="w-full px-3 py-2 rounded border border-zinc-300 dark:border-zinc-700 mb-2" value="${userData[type]}"/>`;
    }

    modalContent.innerHTML += `<input type="password" id="confirmPasswordModal" placeholder="Contraseña" class="w-full px-3 py-2 rounded border border-zinc-300 dark:border-zinc-700"/>`;
  });
});

document.getElementById('cancelChange').addEventListener('click', ()=> document.getElementById('modalChange').classList.add('hidden'));

document.getElementById('confirmChange').addEventListener('click', ()=>{
  if(!currentChangeType) return;
  const pwd = document.getElementById('confirmPasswordModal').value;
  if(pwd!==userData.password){ alert("Contraseña incorrecta"); return; }

  if(currentChangeType==="password"){
    const newP = document.getElementById('newPassword').value;
    const confirmP = document.getElementById('confirmNewPassword').value;
    if(!newP || newP!==confirmP){ alert("Las contraseñas no coinciden"); return; }
    userData.password = newP;
  } else if(currentChangeType==="role"){
    const newR = document.getElementById('newRole').value;
    userData.role = newR;
    document.getElementById('userRole').textContent = newR;
    document.getElementById('userRole2').textContent = newR;
  } else {
    const val = document.getElementById('modalInput').value;
    userData[currentChangeType] = val;
    if(currentChangeType==="username") document.getElementById('userName').textContent = val;
    if(currentChangeType==="email") document.getElementById('userEmail').textContent = val;
  }

  document.getElementById('modalChange').classList.add('hidden');

  // Mostrar botón de revertir
  revertBtns.forEach(r=>{
    if(r.dataset.type===currentChangeType) r.classList.remove('hidden');
  });
});

// Revertir cambios
revertBtns.forEach(btn=>{
  btn.addEventListener('click', e=>{
    const type = e.currentTarget.dataset.type;
    if(type==="username") document.getElementById('userName').textContent = backupValue;
    if(type==="email") document.getElementById('userEmail').textContent = backupValue;
    if(type==="role"){
      document.getElementById('userRole').textContent = backupValue;
      document.getElementById('userRole2').textContent = backupValue;
    }
    userData[type] = backupValue;
    e.currentTarget.classList.add('hidden');
  });
});

// Modal eliminar cuenta
const modalDelete = document.getElementById('modalDelete');
const deleteAccountBtn = document.getElementById('deleteAccountBtn');
const cancelDelete = document.getElementById('cancelDelete');
const confirmDelete = document.getElementById('confirmDelete');
deleteAccountBtn.addEventListener('click', ()=> modalDelete.classList.remove('hidden'));
cancelDelete.addEventListener('click', ()=> modalDelete.classList.add('hidden'));
confirmDelete.addEventListener('click', ()=>{
  modalDelete.classList.add('hidden');
  window.location.href="index.html";
});

// Logout
document.getElementById('logoutBtn').addEventListener('click', ()=> window.location.href="index.html");

// Guardar cambios con animación
document.getElementById('saveChangesBtn').addEventListener('click', ()=>{
  revertBtns.forEach(r=> r.classList.add('hidden')); // ocultar revertir
  const popup = document.getElementById('savePopup');
  popup.classList.add('animate-popup');
  setTimeout(()=> popup.classList.remove('animate-popup'), 1500);
});
</script>

</body>
</html>
