<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Iniciar Sesión</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#3b82f6",
          "background-light": "#f4f4f5",
          "background-dark": "#18181b",
        },
        fontFamily: { display: ["Poppins", "sans-serif"] },
      },
    },
  };
</script>
<style>
  .material-icons { font-size: 24px; line-height: 1; }
  .error-text { color: #dc2626; font-size: 0.875rem; margin-top: 0.25rem; }

  /* Custom (slightly square) checkbox styles */
  .checkbox-wrapper { display: inline-flex; align-items: center; gap: 0.5rem; }
  .checkbox-input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .custom-checkbox {
    width: 20px; height: 20px; border-radius: 4px; /* slightly square */
    border: 2px solid #d1d5db; background: #ffffff; display: inline-block; position: relative; transition: background-color 150ms ease, border-color 150ms ease;
  }
  .dark .custom-checkbox { border-color: #374151; background: #18181b; }
  /* checkmark */
  input[type="checkbox"]:checked + .custom-checkbox {
    background: #3b82f6; border-color: #3b82f6;
  }
  input[type="checkbox"]:checked + .custom-checkbox::after {
    content: ""; position: absolute; left: 5px; top: 2px; width: 6px; height: 11px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  /* focus ring for accessibility */
  input[type="checkbox"]:focus + .custom-checkbox {
    box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
  }
</style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-zinc-900 dark:text-zinc-100">

<div class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md p-8 bg-white dark:bg-zinc-900 rounded-xl shadow-lg">
    <div class="flex flex-col items-center mb-6">
      <img src="logo.png" alt="Logo" class="w-20 h-20 mb-4"/>
      <h1 class="text-3xl font-bold text-zinc-800 dark:text-zinc-200 mb-2">Iniciar Sesión</h1>
      <p class="text-zinc-500 dark:text-zinc-400">Introduce tu correo o usuario y contraseña</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <input type="text" id="usuarioCorreo" placeholder="Correo o Usuario"
          class="w-full px-4 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-primary bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100"/>
        <div id="errorUsuarioCorreo" class="error-text hidden">Debe ingresar un correo o usuario.</div>
      </div>

      <div>
        <input type="password" id="password" placeholder="Contraseña"
          class="w-full px-4 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-primary bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100"/>
        <div id="errorPassword" class="error-text hidden">Debe ingresar la contraseña.</div>
      </div>

      <!-- Recuérdame: checkbox un poco cuadrado -->
      <div class="flex items-center justify-between">
        <label for="rememberMe" class="checkbox-wrapper text-sm text-zinc-700 dark:text-zinc-300">
          <input id="rememberMe" type="checkbox" class="checkbox-input" />
          <span class="custom-checkbox" aria-hidden="true"></span>
          <span>Recuérdame</span>
        </label>
        <a href="#" class="text-sm text-zinc-500 dark:text-zinc-400 hover:underline">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="w-full bg-primary text-white py-2 rounded-lg hover:bg-blue-600 transition-colors">Iniciar Sesión</button>
    </form>

    <div class="flex justify-between mt-4">
      <a href="index.html" class="text-zinc-500 dark:text-zinc-400 hover:underline flex items-center gap-1">
        <span class="material-icons text-sm">arrow_back</span> Volver
      </a>
      <a href="registrarse.html" class="text-primary font-semibold hover:underline">¿No tienes cuenta? Regístrate</a>
    </div>
  </div>
</div>

<script>
const loginForm = document.getElementById('loginForm');
const usuarioCorreo = document.getElementById('usuarioCorreo');
const password = document.getElementById('password');
const errorUsuarioCorreo = document.getElementById('errorUsuarioCorreo');
const errorPassword = document.getElementById('errorPassword');

loginForm.addEventListener('submit', (e) => {
  e.preventDefault();
  let valid = true;

  if(!usuarioCorreo.value.trim()){
    errorUsuarioCorreo.classList.remove('hidden');
    valid = false;
  } else {
    errorUsuarioCorreo.classList.add('hidden');
  }

  if(!password.value.trim()){
    errorPassword.classList.remove('hidden');
    valid = false;
  } else {
    errorPassword.classList.add('hidden');
  }

  if(valid){
    // Aquí podrías enviar a servidor o guardar el estado de "Recuérdame"
    // Por ahora redirigimos a la siguiente página
    window.location.href = "AnalisisVeracidadTexto.html";
  }
});
</script>

</body>
</html>
